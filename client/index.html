<!DOCTYPE html>
<html lang="en" style="background-color: #0B0F17;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendSmart</title>
    
    <!-- BLOCKER SCRIPT: Forces theme class before layout paints -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem('spend-smart-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.style.backgroundColor = '#0B0F17';
        } else {
          document.documentElement.classList.remove('dark-mode');
          document.documentElement.style.backgroundColor = '#F8FAFC';
        }
      })();
    </script>
  </head>
  <body style="background-color: transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
